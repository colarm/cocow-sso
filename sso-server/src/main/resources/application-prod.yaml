# 生产环境配置（Docker 容器内运行）
# 由 docker-compose.yml 的 SPRING_PROFILES_ACTIVE=prod 激活

server:
  port: 8080 # Docker 内部端口，与 docker-compose expose 及 nginx upstream 一致

spring:
  datasource:
    # 使用 Docker Compose 服务名 "mysql" 作为主机名
    url: jdbc:mysql://mysql:3306/sso?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ssouser
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis 暂时禁用
  # data:
  #   redis:
  #     host: redis
  #     port: 6379
  #     password: ${REDIS_PASSWORD:}
  #     database: 0
  #     timeout: 3000ms
  #     lettuce:
  #       pool:
  #         max-active: 8
  #         max-idle: 8
  #         min-idle: 0

logging:
  level:
    root: WARN
    site.cocow.sso: INFO
