services:
  # SSO Server (Spring Boot)
  sso-server:
    build:
      context: ./sso-server
      dockerfile: docker/Dockerfile
    container_name: sso-server
    expose:
      - 8080
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    depends_on:
      - mysql
      - redis
    networks:
      - sso-network

  # SSO Frontend (Vue 3 static files, proxy handled by cocow-gate)
  sso-frontend:
    build: ./sso-frontend
    container_name: sso-frontend
    expose:
      - 8080
    depends_on:
      - sso-server
    networks:
      - sso-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sso-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=sso
      - MYSQL_USER=ssouser
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    expose:
      - 3306
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sso-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sso-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    expose:
      - 6379
    volumes:
      - redis-data:/data
    networks:
      - sso-network

volumes:
  mysql-data:
  redis-data:

networks:
  sso-network:
    external: true
    name: sso-network
